<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 64" width="264" height="64" role="img" aria-label="JEBI TRUST">
  <title>JEBI TRUST</title>
  <!-- seal -->
  <path d="M30 5 L53.4 18.5 L53.4 45.5 L30 59 L6.6 45.5 L6.6 18.5 Z"
        fill="rgba(29,155,240,0.055)" stroke="#2c343d" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- three codes: batch / asset / token -->
  <g stroke-linecap="round" stroke-width="5">
    <path d="M16.5 22.5 H29" stroke="#39424c"/>
    <path d="M16.5 31.5 H35.5" stroke="#6b7884"/>
    <path d="M16.5 40.5 H42" stroke="#1d9bf0"/>
  </g>
  <!-- ledger spine -->
  <path d="M43 15.5 V48.5" stroke="#1d9bf0" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
  <!-- wordmark: 40px character size -->
  <text x="72" y="45" font-size="40" fill="#e9ecef"
        font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-weight="700" letter-spacing="-1">JEBI</tspan><tspan font-weight="300" dx="7" fill="#1d9bf0">TRUST</tspan></text>
</svg>
